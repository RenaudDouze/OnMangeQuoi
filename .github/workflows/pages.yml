name: Déploiement GitHub Pages

on:
  # Comme deploy.yml : se déclenche après un CI réussi sur main, jamais sur
  # un commit dont lint/typecheck/tests/build ont échoué.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (client pointant vers le Worker Cloudflare)
        env:
          # Le client GitHub Pages est servi sur une origine différente du
          # Worker : cette variable (Settings → Secrets and variables →
          # Actions → Variables, vars.DEPLOY_URL — la même que celle lue par
          # deploy.yml) lui indique où trouver l'API et le WebSocket. À
          # définir une fois le Worker déployé (son URL *.workers.dev, ou un
          # domaine personnalisé) — tant que la variable est absente, le
          # build reste possible mais l'app servie par Pages n'a personne à
          # qui parler (chemins /api/... relatifs à Pages, qui ne les sert
          # pas).
          VITE_SYNC_WORKER_URL: ${{ vars.DEPLOY_URL }}
          # Un dépôt de projet (pas <user>.github.io) est servi sous
          # /<nom-du-dépôt>/ plutôt qu'à la racine du domaine : voir `base`
          # dans vite.config.ts et src/lib/basePath.ts.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Fallback SPA (routes /l/CODE rechargées ou ouvertes directement)
        # GitHub Pages n'a pas d'équivalent au `not_found_handling:
        # single-page-application` de Cloudflare : sans ceci, ouvrir ou
        # recharger un lien partagé donnerait un 404 au lieu de servir l'app,
        # qui route elle-même via location.pathname une fois chargée.
        run: cp dist/client/index.html dist/client/404.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
